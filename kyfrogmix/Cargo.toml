[package]
name = "kyfrogmix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Linux video mixer (V4L2 capture + GPU compositing) — Slint touch control surface"

[dependencies]
slint = "=1.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.13"
